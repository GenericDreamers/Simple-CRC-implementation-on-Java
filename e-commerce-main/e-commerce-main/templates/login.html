<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LOGIN - Noir AI Sport Tech</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='templatemo-noir-fashion.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        .login-section {min-height:100vh;display:flex;align-items:center;justify-content:center;padding:140px 20px 80px;background:radial-gradient(circle at center,rgba(255,51,102,0.08) 0%,transparent 70%);}
        .login-card {background:linear-gradient(135deg,#1a1a1a,#0a0a0a);padding:60px 50px;border-radius:16px;max-width:480px;border:1px solid rgba(255,51,102,0.2);box-shadow:0 30px 80px rgba(0,0,0,0.8);position:relative;overflow:hidden;}
        .login-title {font-size:42px;text-align:center;margin-bottom:15px;letter-spacing:-2px;}
        .login-subtitle {text-align:center;color:var(--text-muted);margin-bottom:40px;font-size:14px;letter-spacing:3px;text-transform:uppercase;}
        .form-group {margin-bottom:25px;}
        .form-group input {width:100%;padding:18px 20px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:8px;color:white;font-size:16px;transition:all .4s;}
        .form-group input:focus {outline:none;border-color:var(--accent);box-shadow:0 0 20px rgba(255,51,102,0.3);background:rgba(255,51,102,0.08);}
        .btn-login {width:100%;padding:18px;background:var(--accent);color:white;border:none;border-radius:8px;font-size:16px;font-weight:600;text-transform:uppercase;letter-spacing:3px;cursor:pointer;transition:all .4s;margin-top:20px;}
        .btn-login:hover {background:var(--accent-hover);transform:translateY(-3px);box-shadow:0 20px 40px rgba(255,51,102,0.4);}
        .demo-cred {text-align:center;margin-top:30px;padding:15px;background:rgba(255,51,102,0.1);border-radius:8px;font-size:13px;color:#ff6690;}
    </style>
</head>
<body>

    {% include 'partials/navbar.html' %}

    <section class="login-section">
        <div class="login-card">
            <h1 class="login-title">LOGIN</h1>
            <p class="login-subtitle">Access to sports AI management system</p>

            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div style="padding:15px;margin-bottom:20px;border-radius:8px;background:rgba(255,51,102,0.15);border:1px solid var(--accent);text-align:center;color:white;">
                            {{ message }}
                        </div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <!-- ĐÃ SỬA DÒNG NÀY – BÂY GIỜ HOẠT ĐỘNG 100% -->
            <form method="POST" action="{{ url_for('login') }}">
                <div class="form-group">
                    <input type="text" name="username" placeholder="Account" required autofocus>
                </div>
                <div class="form-group">
                    <input type="password" name="password" placeholder="Password" required>
                </div>
                <button type="submit" class="btn-login">
                    Sign in now
                </button>
            </form>

            <div class="demo-cred">
                <strong>Demo:</strong> admin / 123456
            </div>
        </div>
    </section>
</body>
</html>
